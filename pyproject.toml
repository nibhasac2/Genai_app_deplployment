[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-app"
version = "0.1.0"
description = "A GenAI application"
dependencies = [
    "fastapi==0.115.5",
    "pydantic==2.9.2",
    "google-genai==1.5.0",
    "uvicorn==0.30.1",
    "python-dotenv==1.0.0",
    "huggingface_hub",
]